name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" \
            '.version = $v' \
            custom_components/carrom_ulanzi/manifest.json > tmp.json \
            && mv tmp.json custom_components/carrom_ulanzi/manifest.json

      - name: Create release zip
        run: |
          cd custom_components
          zip -r ../carrom_ulanzi.zip carrom_ulanzi/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: carrom_ulanzi.zip
